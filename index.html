<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Prestasi Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-700">🏆 Data Prestasi Siswa</h1>
            <p class="text-gray-500 mt-2">Monitoring hasil lomba secara real-time</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <h3 class="text-xl font-bold mb-4 text-gray-700">Statistik Juara Per Tahun</h3>
            <div class="h-64">
                <canvas id="chartJuara"></canvas>
            </div>
        </div>
        
        <div class="overflow-x-auto bg-white rounded-2xl shadow-lg border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-indigo-600 text-white">
                        <th class="p-4">Nama Siswa</th>
                        <th class="p-4">Cabang Lomba</th>
                        <th class="p-4">Juara</th>
                        <th class="p-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GAS KAMU
        const API_URL = "https://script.google.com/macros/s/AKfycbxZ0k_aT6bpD9geRYWN9bFGeqMf3uRXVam7VQy2k4UR-4PJj_DPWtMSTWMKK7ej6_hd/exec";

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderTable(data);
                renderChart(data);
            } catch (err) {
                console.error("Gagal memuat data", err);
            }
        }

        function renderTable(data) {
            const container = document.getElementById('tableBody');
            container.innerHTML = data.map((item, index) => `
                <tr class="border-b hover:bg-indigo-50 transition-colors duration-200 cursor-pointer group" onclick="showDetail(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                    <td class="p-4 font-semibold text-gray-700">${item.nama_siswa}</td>
                    <td class="p-4 text-gray-600">${item.cabang_lomba}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${item.juara_lomba.includes('1') ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'}">
                            ${item.juara_lomba}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        <button class="text-indigo-600 group-hover:scale-125 transition-transform">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function showDetail(item) {
            Swal.fire({
                title: `<span class="text-indigo-600">${item.nama_siswa}</span>`,
                html: `
                    <div class="text-left space-y-2 p-2">
                        <p><strong>NISN:</strong> ${item.nisn}</p>
                        <p><strong>Cabang:</strong> ${item.cabang_lomba}</p>
                        <p><strong>Bidang:</strong> ${item.bidang_lomba}</p>
                        <p><strong>Pencapaian:</strong> ${item.juara_lomba}</p>
                        <p class="text-xs text-gray-400 mt-4 italic">Terdata pada: ${item.timestamp}</p>
                    </div>
                `,
                icon: 'info',
                confirmButtonColor: '#4F46E5'
            });
        }

        function renderChart(data) {
            const ctx = document.getElementById('chartJuara').getContext('2d');
            // Logika sederhana mengambil tahun dari timestamp
            const years = [...new Set(data.map(d => new Date(d.timestamp).getFullYear()))].sort();
            const counts = years.map(y => data.filter(d => new Date(d.timestamp).getFullYear() === y).length);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: 'Total Prestasi',
                        data: counts,
                        borderColor: '#4F46E5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        fetchData();
    </script>
</body>
</html>
